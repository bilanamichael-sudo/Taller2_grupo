<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimercados AMG</title>

<!-- Bootstrap 5 (framework CSS moderno) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<!--  ||header de dla pagina||
<header class="market-header sticky-top">
  <div class="container">
    <div class="d-flex align-items-center justify-content-between py-3 flex-wrap gap-3">
      <a class="brand d-flex align-items-center gap-2 text-decoration-none" href="#">
        <span class="brand-badge">AMG</span>
        <span class="brand-text">
          <span class="brand-title">Minimercados</span>
          <span class="brand-sub">AMG&nbsp;</span>
        </span>
      </a>

      <div class="search-wrap flex-grow-1">
        <i class="bi bi-search"></i>
        <input
          id="searchInput"
          type="search"
          class="form-control search-input"
          placeholder="Buscar productos… ej. tomate, leche, pan"
          autocomplete="off"
        >
      </div>

      <button class="btn cart-btn position-relative" id="openCartBtn" data-bs-toggle="offcanvas" data-bs-target="#cartPanel">
        <i class="bi bi-basket3-fill"></i> Carrito
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>


<section class="hero">
  <div class="container">
    <p class="eyebrow">San Blas · Quito</p>
    <h1>Todo lo del diario, a un clic de tu carrito.</h1>
    <p class="hero-copy">Frutas frescas, lácteos, panadería y más — busca, filtra por pasillo y arma tu pedido.</p>
  </div>
</section>

<!-- |||||categorias||||:
<section class="container categories-section">
  <h2 class="section-label">Pasillos</h2>
  <div class="category-row" id="categoryRow">
    <button class="chip active" data-category="todos">Todos</button>
    <button class="chip" data-category="frutas">🍎 Frutas y Verduras</button>
    <button class="chip" data-category="lacteos">🥛 Lácteos</button>
    <button class="chip" data-category="panaderia">🍞 Panadería</button>
    <button class="chip" data-category="bebidas">🧃 Bebidas</button>
    <button class="chip" data-category="snacks">🍪 Snacks</button>
    <button class="chip" data-category="aseo">🧼 Aseo del Hogar</button>
  </div>
</section>

<!-- |||productos||||:
<section class="container products-section">
  <div class="d-flex justify-content-between align-items-baseline mb-3 flex-wrap gap-2">
    <h2 class="section-label mb-0">Productos</h2>
    <span class="result-count" id="resultCount"></span>
  </div>
  <div class="row g-3" id="productGrid"></div>
  <p class="empty-state d-none" id="emptyState">
    <i class="bi bi-emoji-frown"></i> No encontramos productos con ese criterio. Prueba con otra palabra o pasillo.
  </p>
</section>

<footer class="market-footer text-center py-4">
  <p class="mb-0">Minimercados AMG · Av.Maldonado y Av. Guayanay Ñan</p>
</footer>

<!-- |||||||Carrito|||||:
<div class="offcanvas offcanvas-end" tabindex="-1" id="cartPanel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title"><i class="bi bi-basket3-fill"></i> Tu carrito</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">
    <div id="cartItems" class="cart-items flex-grow-1"></div>

    <p class="cart-empty-msg" id="cartEmptyMsg">
      <i class="bi bi-basket"></i><br>Tu carrito está vacío.
    </p>

    <div class="cart-summary" id="cartSummary">
      <div class="d-flex justify-content-between">
        <span>Subtotal</span>
        <strong id="cartSubtotal">$0.00</strong>
      </div>
      <div class="d-flex justify-content-between text-muted small">
        <span>Envío</span>
        <span>Gratis</span>
      </div>
      <hr>
      <div class="d-flex justify-content-between fs-5">
        <span>Total</span>
        <strong id="cartTotal">$0.00</strong>
      </div>
      <button class="btn checkout-btn w-100 mt-3" id="checkoutBtn">Finalizar compra</button>
      <button class="btn btn-link w-100 text-muted" id="clearCartBtn">Vaciar carrito</button>
    </div>
  </div>
</div>

<!-- ||||||confirmacion||||:
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="addToast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody">Producto agregado</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
